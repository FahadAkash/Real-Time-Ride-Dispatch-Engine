# For clusters running kube-prometheus-stack (Prometheus Operator).
# Each app Service must expose a port named "metrics" (9100) and carry the label below.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ride-dispatch
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: ride-dispatch
  namespaceSelector:
    matchNames: [dispatch]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
