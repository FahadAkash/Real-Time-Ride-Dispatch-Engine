route:
  receiver: default
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - matchers: [severity="critical"]
      receiver: oncall
      repeat_interval: 1h

receivers:
  - name: default
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_url
        channel: "#dispatch-alerts"
        send_resolved: true
  - name: oncall
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_url
        channel: "#dispatch-oncall"
        send_resolved: true

inhibit_rules:
  - source_matchers: [alertname="ServiceDown"]
    target_matchers: [severity="warning"]
    equal: [service]
